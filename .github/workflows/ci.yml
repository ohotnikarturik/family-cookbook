name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3003
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:client-bundle

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on main push for Gitleaks; shallow otherwise (0 is falsy in &&/|| so invert condition).
          fetch-depth: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && 1 || 0 }}

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (audit)
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

  pgtap:
    name: pgTAP / RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Postgres only: pgTAP talks to the DB via docker exec (no Auth/API/Studio).
      - name: Start Postgres
        run: pnpm supabase:db:start

      - name: Reset database
        run: pnpm supabase:reset

      - name: Run pgTAP
        run: pnpm supabase:test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3099
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3099
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Supabase
        run: pnpm supabase:start:core

      - name: Reset database and sync web env
        run: |
          pnpm supabase:reset
          pnpm supabase:sync-env

      - name: Build
        run: pnpm build

      - name: Run Playwright
        working-directory: apps/web
        run: pnpm test:e2e
