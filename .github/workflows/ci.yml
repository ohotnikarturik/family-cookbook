name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3003
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:client-bundle

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on main push for Gitleaks; shallow otherwise (0 is falsy in &&/|| so invert condition).
          fetch-depth: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && 1 || 0 }}

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (audit)
        run: pnpm install --frozen-lockfile

      # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, <=4.0.7) has no patched release and is reachable
      # only through dev tooling. Remove --ignore once picomatch ships a fix (docs/DECISIONS.md).
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high --ignore GHSA-fc5q-39xc-vjpf

  pgtap:
    name: pgTAP / RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Postgres only: pgTAP talks to the DB via docker exec (no Auth/API/Studio).
      - name: Start Postgres
        run: pnpm supabase:db:start

      # `supabase db reset` recreates the DB container; on GitHub runners the old host port
      # 54322 is sometimes not released yet ("address already in use"). Retry a bounded
      # number of times, restarting Postgres between attempts. Migrations still run from clean.
      - name: Reset database
        run: |
          for attempt in 1 2 3; do
            if pnpm supabase:reset; then exit 0; fi
            echo "supabase reset failed (attempt $attempt/3); restarting Postgres"
            pnpm supabase:stop --no-backup || true
            sleep 10
            pnpm supabase:db:start || true
          done
          echo "supabase reset failed after 3 attempts"
          exit 1

      - name: Run pgTAP
        run: pnpm supabase:test

  e2e:
    name: Playwright E2E
    # Playwright 1.56.1 has no Chromium for Ubuntu 26.04 (`ubuntu-latest` as of Oct 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3099
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3099
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Supabase
        run: pnpm supabase:start:core

      - name: Reset database and sync web env
        run: |
          pnpm supabase:reset
          pnpm supabase:sync-env

      - name: Build
        run: pnpm build

      - name: Run Playwright
        working-directory: apps/web
        run: pnpm test:e2e
